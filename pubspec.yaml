name: civicshield
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.2.0
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  firebase_storage: ^13.1.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^6.2.1
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  cloudinary_public: ^0.23.1
  intl: ^0.20.2
  webfeed: ^0.7.0
  flutter_dotenv: ^5.2.1
  translator: ^1.0.4

dependency_overrides:
  intl: ^0.20.2
  xml: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/.env
